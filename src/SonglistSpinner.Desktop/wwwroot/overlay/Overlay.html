<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay — SonglistSpinner</title>
<style>
:root{
    --app-text-color: #ffffff;
    --app-status-bg: rgba(0, 0, 0, 0.7);
    --app-played-list-bg: rgba(0, 0, 0, 0.7);
    --app-now-playing-bg: rgba(0, 0, 0, 0.7);
    --app-played-item-bg: #222222;
    --app-resize-handle-bg: #333;
    --app-resize-handle-hover-bg: #555;
    --app-toggle-bg: #222;
    --app-button-bg: #555555;
    --app-button-text: #cccccc;
    --app-pointer-color: wheat;
    --app-played-list-font-family: sans-serif;
    --app-played-list-font-size: 0.875rem;
    --app-played-list-max-lines: 2;
    --app-winner-dialog-font-family: sans-serif;
    --app-winner-dialog-font-size: 1rem;
    --app-winner-dialog-width: 36rem;
}
html, body {
    height: 100%;
}
body{
    background:#111;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color:var(--app-text-color);
    font-family:sans-serif;
    text-align:center;
    margin:0;
    padding:0;
    height: 100%;
    overflow:hidden;
}
#container{
    display:flex;
    justify-content: space-between;
    height: 100%;
    min-height: 0;
}
#container.played-list-left{
    flex-direction: row-reverse;
}
#wheelSection{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:1.25rem;
    min-width:0;
    min-height:0;
}
#wheelContents{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:1.25rem;
    min-width:0;
    min-height:0;
}
#buttonContainer{
    display:flex;
    gap:0.625rem;
}
#resizeHandle{
    width:0.625rem;
    background:var(--app-resize-handle-bg);
    cursor:ew-resize;
    position:relative;
}
#resizeHandle:hover{
    background:var(--app-resize-handle-hover-bg);
}
#playedListTop{
    display:flex;
    align-items:center;
    gap:0.625rem;
    flex-shrink: 0;
    padding:1.25rem;
    padding-bottom:0;
}
#container.played-list-left #playedListTop{
    flex-direction:row-reverse;
}
#playedList.collapsed #playedListTop{
    padding:0.5rem;
}
#streamerSection{
    display:flex;
    align-items:center;
    gap:0.625rem;
    flex-wrap:wrap;
    flex:1;
}
#streamerLabel{
    font-size:1rem;
    font-weight:bold;
}
.small-button{
    padding:0.3125rem 0.9375rem;
    font-size:0.875rem;
    margin:0;
}
#wheelContainer{
    width:clamp(6.25rem, 70vmin, 100%);
    height:clamp(6.25rem, 70vmin, 100%);
    aspect-ratio: 1;
    max-width: min(90vw, 100%);
    max-height: 80vh;
    flex-shrink:1;
}
#pointer{
    width:0;
    height:0;
    border-left:1.5625rem solid transparent;
    border-right:1.5625rem solid transparent;
    border-top:2.5rem solid var(--app-pointer-color);
}
button{
    margin-top:1.25rem;
    padding:0.75rem 1.875rem;
    font-size:1.25rem;
    cursor:pointer;
    background:var(--app-button-bg);
    color:var(--app-button-text);
}
#songCounterSection{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-direction: row;
    gap:0.625rem;
    margin-bottom:0.625rem;
}
#playedList{
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    text-align:left;
    width:min(31.25rem, 40vw);
    min-width:18.75rem;
    max-width:50rem;
    overflow:hidden;
    background:var(--app-played-list-bg);
    transition: width 0.3s ease;
    position: relative;
}
#playedList.collapsed{
    display: none !important;
}
.collapse-button{
    background:var(--app-button-bg);
    color:var(--app-button-text);
    border:none;
    width:2rem;
    height:2rem;
    cursor:pointer;
    border-radius:0.25rem;
    font-size:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    margin:0;
    flex-shrink:0;
}
.collapse-button:hover{
    opacity:0.8;
}
#playedListContent{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height: 0;
    overflow:hidden;
    padding:0 1.25rem;
    padding-bottom:0;
}
#playedList h3{
    margin-top:0;
}
#playedList ul{
    list-style:none;
    padding:0;
    flex:1;
    overflow-y:auto;
    min-height: 0;
    margin:0;
}
#playedList li{
    padding:0.5rem;
    margin:0.25rem 0;
    background:var(--app-played-item-bg);
    border-radius:0.25rem;
    font-size:var(--app-played-list-font-size);
    font-family:var(--app-played-list-font-family);
}
#playedList li > .played-song-text{
    line-height:1.4em;
    max-height:calc(var(--app-played-list-max-lines) * 1.4em);
    overflow: hidden;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: var(--app-played-list-max-lines);
}
#nowPlaying{
    position:fixed;
    z-index:100;
    box-sizing:border-box;
    max-width:calc(100vw - 2rem);
    padding:0.875rem 1rem;
    border-radius:0.5rem;
    background:var(--app-now-playing-bg);
    color:var(--app-text-color);
    box-shadow:0 0.25rem 1.25rem rgba(0, 0, 0, 0.35);
    text-align:left;
    pointer-events:none;
}
#nowPlaying[hidden]{
    display:none !important;
}
#nowPlayingLabel{
    display:block;
    margin-bottom:0.25rem;
    font-size:0.7em;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.8;
}
#nowPlayingText{
    display:block;
    overflow-wrap:anywhere;
    line-height:1.35;
}
#nowPlaying[data-position="top-left"]{
    top:1rem;
    left:1rem;
}
#nowPlaying[data-position="top-center"]{
    top:1rem;
    left:50%;
    transform:translateX(-50%);
}
#nowPlaying[data-position="top-right"]{
    top:1rem;
    right:1rem;
}
#nowPlaying[data-position="bottom-left"]{
    bottom:1rem;
    left:1rem;
}
#nowPlaying[data-position="bottom-center"]{
    bottom:1rem;
    left:50%;
    transform:translateX(-50%);
}
#nowPlaying[data-position="bottom-right"]{
    right:1rem;
    bottom:1rem;
}
.winner-modal{
    position:fixed;
    inset:0;
    z-index:1000;
}
.winner-modal-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0, 0, 0, 0.65);
}
.winner-modal-content{
    position:relative;
    width:min(90vw, var(--app-winner-dialog-width));
    margin:10vh auto 0;
    padding:1.5rem;
    border-radius:0.75rem;
    background:rgba(24, 24, 24, 0.95);
    color:var(--app-text-color);
    font-family:var(--app-winner-dialog-font-family);
    font-size:var(--app-winner-dialog-font-size);
    box-shadow:0 0 30px rgba(255, 225, 120, 0.35);
    text-align:center;
    overflow:hidden;
    animation:winner-pop 280ms ease-out;
}
.winner-fields{
    margin:0.75rem 0 1rem;
    font-size:1em;
}
.winner-field-separator{
    margin:0 0.35em;
    opacity:0.7;
}
.winner-field-label{
    font-weight:700;
}
.winner-field-value{
    margin-left:0.25em;
    font-weight:400;
}
.winner-queue-position{
    margin:-0.5rem 0 1rem;
    font-size:0.9em;
    font-weight:600;
    opacity:0.9;
}
.winner-confetti{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}
.winner-confetti-piece{
    position:absolute;
    top:-10%;
    width:8px;
    height:14px;
    border-radius:2px;
    opacity:0.95;
    animation:confetti-fall 1.6s linear forwards;
}
@keyframes winner-pop{
    0% { transform:scale(0.92); opacity:0; }
    100% { transform:scale(1); opacity:1; }
}
@keyframes confetti-fall{
    0% { transform:translateY(-10%) rotate(0deg); }
    100% { transform:translateY(115vh) rotate(540deg); opacity:0.85; }
}
@media (max-width: 1200px) {
    #wheelContainer{
        width:clamp(6.25rem, min(60vmin, 85%), 40rem);
        height:clamp(6.25rem, min(60vmin, 85%), 40rem);
    }
    #playedList{
        width:min(25rem, 35vw);
        min-width:15rem;
    }
}
@media (max-width: 900px) {
    #container{
        flex-direction: column;
    }
    #wheelSection{
        padding-top:0.5rem;
    }
    #wheelContents{
        padding-top:0.5rem;
    }
    #wheelContainer{
        width:clamp(6.25rem, min(50vmin, 80vw), 30rem);
        height:clamp(6.25rem, min(50vmin, 80vw), 30rem);
    }
    #resizeHandle{
        display:none;
    }
    #playedList{
        width:100%;
        min-width:100%;
        max-width:100%;
        height:auto;
        max-height:40vh;
        border-top:2px solid var(--app-resize-handle-bg);
    }
    #songCounterSection{
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    #songCounterSection h3{
        font-size:1rem;
        margin:0.5rem 0;
        flex-shrink: 0;
    }
}
@media (max-width: 600px) {
    #wheelContainer{
        width:clamp(6.25rem, 85vw, 25rem);
        height:clamp(6.25rem, 85vw, 25rem);
    }
    #pointer{
        border-left:1rem solid transparent;
        border-right:1rem solid transparent;
        border-top:1.5rem solid var(--app-pointer-color);
    }
    button{
        padding:0.5rem 1.25rem;
        font-size:1rem;
    }
    #playedList{
        padding-left:0.75rem;
        padding-right:0.75rem;
    }
}
</style>
</head>
<body>

<section id="nowPlaying" data-position="bottom-left" hidden aria-live="polite">
    <span id="nowPlayingLabel">Now Playing</span>
    <span id="nowPlayingText"></span>
</section>

<div id="container">
    <div id="wheelSection">
        <div id="wheelContents">
            <div id="pointer"></div>
            <div id="wheelContainer"></div>
        </div>
    </div>
    <div id="resizeHandle" style="display:none"></div>
    <div id="playedList" data-position="right">
        <div id="playedListTop">
            <div id="streamerSection">
                <span id="streamerLabel">Waiting for Dashboard...</span>
            </div>
        </div>
        <div id="playedListContent">
            <div id="songCounterSection">
                <h3>Played Songs: <span id="playedCount">0</span></h3>
                <h3>Queued Songs: <span id="availableCount">0</span></h3>
            </div>
            <ul id="playedSongsUl"></ul>
        </div>
    </div>
</div>

<div id="winnerModal" class="winner-modal" style="display:none">
    <div class="winner-modal-backdrop" aria-hidden="true"></div>
    <div class="winner-modal-content" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
        <div id="winnerConfetti" class="winner-confetti"></div>
        <h2 id="winnerTitle">Winner</h2>
        <p id="winnerFields" class="winner-fields" hidden></p>
        <p id="winnerQueuePosition" class="winner-queue-position" hidden>
            Queue position: <strong id="winnerQueuePositionValue"></strong>
        </p>
    </div>
</div>

<script src="/overlay/spin-wheel-iife.js"></script>
<script>
window.SpinnerInterop = (function () {
    let _wheel = null
    let _resizeTimeout = null
    let _wheelItems = []
    let _wheelColors = []

    const wheelLabelRadius = 0.9
    const wheelLabelRadiusMax = 0.08
    const wheelLabelFontSizeMin = 12
    const wheelLabelFontSizeMax = 28

    function calculateWheelLabelFontSize(itemCount) {
        if (itemCount <= 1) return wheelLabelFontSizeMax

        const referenceLabelRadius = 250 * 0.95 * 0.55
        const sliceHeight = 2 * referenceLabelRadius * Math.sin(Math.PI / itemCount)
        return Math.max(
            wheelLabelFontSizeMin,
            Math.min(wheelLabelFontSizeMax, Math.floor(sliceHeight * 0.68)))
    }

    function fitWheelLabel(context, label, fontSize, maxWidth) {
        if (!context || typeof label !== 'string') return label || ''

        context.font = `${fontSize}px sans-serif`
        if (context.measureText(label).width <= maxWidth) return label

        const ellipsis = '…'
        let lower = 0
        let upper = label.length
        while (lower < upper) {
            const length = Math.ceil((lower + upper) / 2)
            const candidate = `${label.slice(0, length).trimEnd()}${ellipsis}`
            if (context.measureText(candidate).width <= maxWidth) {
                lower = length
            } else {
                upper = length - 1
            }
        }

        return `${label.slice(0, lower).trimEnd()}${ellipsis}`
    }

    function buildWheel(container) {
        const fontSize = calculateWheelLabelFontSize(_wheelItems.length)
        const referenceRadius = 250 * 0.95
        const maxLabelWidth = referenceRadius * (wheelLabelRadius - wheelLabelRadiusMax)
        const measureContext = document.createElement('canvas').getContext('2d')
        const fittedItems = _wheelItems.map(item => ({
            ...item,
            label: fitWheelLabel(measureContext, item.label, fontSize, maxLabelWidth)
        }))

        return new spinWheel.Wheel(container, {
            items: fittedItems,
            itemBackgroundColors: _wheelColors,
            itemLabelFontSizeMax: fontSize,
            itemLabelRadius: wheelLabelRadius,
            itemLabelRadiusMax: wheelLabelRadiusMax,
            itemLabelStrokeWidth: 1,
            borderWidth: 0,
            lineWidth: 0,
            radius: 0.95,
            isInteractive: false
        })
    }

    return {
        createWheel(items, colors) {
            const container = document.getElementById('wheelContainer')
            if (!container) return
            if (!window.spinWheel || !window.spinWheel.Wheel) {
                container.textContent = 'The wheel component could not be loaded.'
                return
            }
            if (_wheel) { _wheel.remove(); _wheel = null }
            _wheelItems = Array.isArray(items) ? items : []
            _wheelColors = Array.isArray(colors) ? colors : []
            _wheel = buildWheel(container)
        },

        spinToItem(index, duration) {
            if (_wheel) _wheel.spinToItem(index, duration)
        },

        setupResizeObserver() {
            const container = document.getElementById('wheelContainer')
            if (!container || !window.ResizeObserver) return
            new ResizeObserver(() => {
                if (_wheel) {
                    clearTimeout(_resizeTimeout)
                    _resizeTimeout = setTimeout(() => {
                        if (_wheel) {
                            _wheel.remove()
                            _wheel = buildWheel(container)
                        }
                    }, 200)
                }
            }).observe(container)
        },

        applyTheme(colors, playedList, winnerDialog) {
            const r = document.documentElement
            if (!colors) return
            r.style.setProperty('--app-text-color', colors.text || '')
            r.style.setProperty('--app-status-bg', colors.statusBackground || '')
            r.style.setProperty('--app-played-list-bg', colors.playedListBackground || '')
            r.style.setProperty('--app-now-playing-bg', colors.nowPlayingBackground || colors.playedListBackground || '')
            r.style.setProperty('--app-played-item-bg', colors.playedItemBackground || '')
            r.style.setProperty('--app-resize-handle-bg', colors.resizeHandleBackground || '')
            r.style.setProperty('--app-resize-handle-hover-bg', colors.resizeHandleHoverBackground || '')
            r.style.setProperty('--app-toggle-bg', colors.toggleBackground || '')
            r.style.setProperty('--app-button-bg', colors.buttonBackground || '')
            r.style.setProperty('--app-button-text', colors.buttonText || '')
            r.style.setProperty('--app-pointer-color', colors.pointer || '')
            if (playedList) {
                r.style.setProperty('--app-played-list-font-family', playedList.fontFamily || '')
                r.style.setProperty('--app-played-list-font-size', playedList.fontSize || '')
                r.style.setProperty('--app-played-list-max-lines', playedList.maxLines ?? '')
            }
            if (winnerDialog) {
                r.style.setProperty('--app-winner-dialog-font-family', winnerDialog.fontFamily || '')
                r.style.setProperty('--app-winner-dialog-font-size', winnerDialog.fontSize || '')
                r.style.setProperty('--app-winner-dialog-width', winnerDialog.width || '')
            }
        },

        applyBackground(background) {
            if (!background) return
            const mode = (background.mode || 'color').toLowerCase()
            document.body.style.backgroundColor = background.color || ''
            if (mode === 'transparent' || mode === 'transparant') {
                document.body.style.backgroundColor = 'transparent'
                document.body.style.backgroundImage = 'none'
            } else if (mode === 'color') {
                document.body.style.backgroundImage = 'none'
            }
        },

        applyPlayedListPosition(position) {
            const container = document.getElementById('container')
            const icon = document.getElementById('collapseIcon')
            if (!container) return
            if ((position || 'right').toLowerCase() === 'left') {
                container.classList.add('played-list-left')
                if (icon) icon.innerText = '\u25BA'
            } else {
                container.classList.remove('played-list-left')
                if (icon) icon.innerText = '\u25C4'
            }
            const pl = document.getElementById('playedList')
            if (pl) pl.dataset.position = (position || 'right').toLowerCase()
        },

        applyNowPlayingConfig(config) {
            const el = document.getElementById('nowPlaying')
            const text = document.getElementById('nowPlayingText')
            if (!el || !text || !config) return
            const validPositions = [
                'top-left', 'top-center', 'top-right',
                'bottom-left', 'bottom-center', 'bottom-right'
            ]
            const position = (config.position || 'bottom-left').toLowerCase()
            el.dataset.position = validPositions.includes(position)
                ? position
                : 'bottom-left'
            el.style.width = config.width || '28rem'
            text.style.fontFamily = config.fontFamily || 'sans-serif'
            text.style.fontSize = config.fontSize || '1.125rem'
        },

        runConfetti(colors) {
            const el = document.getElementById('winnerConfetti')
            if (!el) return
            el.innerHTML = ''
            const palette = colors || ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24']
            for (let i = 0; i < 36; i++) {
                const piece = document.createElement('span')
                piece.className = 'winner-confetti-piece'
                piece.style.left = `${Math.random() * 100}%`
                piece.style.backgroundColor = palette[i % palette.length]
                piece.style.animationDelay = `${Math.random() * 0.5}s`
                piece.style.animationDuration = `${1.2 + Math.random() * 1.1}s`
                el.appendChild(piece)
            }
        },

        setWheelVisible(visible) {
            const el = document.getElementById('wheelContents')
            if (el) el.style.display = visible ? 'flex' : 'none'
        },

        setPlayedListCollapsed(collapsed, position) {
            const el = document.getElementById('playedList')
            const icon = document.getElementById('collapseIcon')
            if (!el) return
            const pos = (position || 'right').toLowerCase()
            if (collapsed) {
                el.classList.add('collapsed')
                if (icon) icon.innerText = pos === 'left' ? '\u25C4' : '\u25BA'
            } else {
                el.classList.remove('collapsed')
                if (icon) icon.innerText = pos === 'left' ? '\u25BA' : '\u25C4'
            }
        },

        setPlayedListWidth(width, minWidth) {
            const el = document.getElementById('playedList')
            if (!el) return
            if (width) el.style.width = width
            if (minWidth) el.style.minWidth = minWidth
        }
    }
})()
</script>
<script>
const _overlayState = { config: null, collapsed: false, wheelItems: [] }
const _isSettingsPreview = new URLSearchParams(window.location.search).get('preview') === '1'

function connectSSE() {
    const es = new EventSource('/overlay/events')

    es.addEventListener('init_state', e => {
        const data = JSON.parse(e.data)
        _overlayState.config = data.config
        _overlayState.collapsed = Boolean(data.playedListCollapsed)
        SpinnerInterop.setPlayedListWidth(data.playedListWidth, data.playedListMinWidth)
        SpinnerInterop.setPlayedListCollapsed(
            _overlayState.collapsed,
            data.config && data.config.songList && data.config.songList.playedListPosition)
        updateSongs(data)
    })

    es.addEventListener('update_songs', e => {
        updateSongs(JSON.parse(e.data))
    })

    es.addEventListener('spin_command', e => {
        const data = JSON.parse(e.data)
        let winnerIndex = data.winnerIndex
        if (data.winnerQueueId != null) {
            const resolvedIndex = _overlayState.wheelItems.findIndex(
                item => Number(item.queueId) === Number(data.winnerQueueId))
            if (resolvedIndex < 0) {
                console.error('The selected winner is not present in the overlay wheel.')
                return
            }
            winnerIndex = resolvedIndex
        }
        SpinnerInterop.spinToItem(winnerIndex, data.duration)
    })

    es.addEventListener('winner_reveal', e => {
        const data = JSON.parse(e.data)
        const queuePosition = Number(data.queuePosition)
        const hasQueuePosition = Number.isInteger(queuePosition) && queuePosition > 0
        const queuePositionElement = document.getElementById('winnerQueuePosition')
        const fieldsElement = document.getElementById('winnerFields')
        const fields = Array.isArray(data.fields)
            ? data.fields.filter(field => field && field.label && field.value)
            : []
        fieldsElement.replaceChildren()
        fields.forEach((field, index) => {
            if (index > 0) {
                const separator = document.createElement('span')
                separator.className = 'winner-field-separator'
                separator.setAttribute('aria-hidden', 'true')
                separator.textContent = '|'
                fieldsElement.appendChild(separator)
            }
            const label = document.createElement('strong')
            label.className = 'winner-field-label'
            label.textContent = field.label
            const value = document.createElement('span')
            value.className = 'winner-field-value'
            value.textContent = field.value
            fieldsElement.append(label, value)
        })
        fieldsElement.hidden = fields.length === 0
        document.getElementById('winnerQueuePositionValue').textContent = hasQueuePosition
            ? `#${queuePosition}`
            : ''
        queuePositionElement.hidden = !hasQueuePosition
        document.getElementById('winnerModal').style.display = 'block'
        if (_overlayState.config) SpinnerInterop.runConfetti(_overlayState.config.wheelColors)
    })

    es.addEventListener('close_winner', () => {
        document.getElementById('winnerModal').style.display = 'none'
    })

    es.addEventListener('set_wheel_visible', e => {
        SpinnerInterop.setWheelVisible(JSON.parse(e.data).visible)
    })

    es.addEventListener('set_collapse', e => {
        const data = JSON.parse(e.data)
        _overlayState.collapsed = data.collapsed
        const pos = _overlayState.config && _overlayState.config.songList && _overlayState.config.songList.playedListPosition
        SpinnerInterop.setPlayedListCollapsed(data.collapsed, pos)
    })

    es.addEventListener('set_played_list_width', e => {
        const data = JSON.parse(e.data)
        SpinnerInterop.setPlayedListWidth(data.width, data.minWidth)
    })

    es.onerror = () => {
        es.close()
        setTimeout(connectSSE, 3000)
    }
}

function updateSongs(data) {
    if (data.config) {
        _overlayState.config = data.config
        SpinnerInterop.applyTheme(data.config.colors, data.config.playedList, data.config.winnerDialog)
        SpinnerInterop.applyBackground(data.config.background)
        SpinnerInterop.applyPlayedListPosition(
            data.config.songList && data.config.songList.playedListPosition)
        SpinnerInterop.applyNowPlayingConfig(data.config.nowPlaying)
    }
    const cfg = _overlayState.config
    _overlayState.wheelItems = data.wheelItems || []
    SpinnerInterop.createWheel(_overlayState.wheelItems, cfg && cfg.wheelColors || [])
    document.getElementById('playedCount').textContent = data.playedCount != null ? data.playedCount : 0
    document.getElementById('availableCount').textContent = data.availableCount != null ? data.availableCount : 0
    if (data.streamer) document.getElementById('streamerLabel').textContent = data.streamer
    const nowPlaying = document.getElementById('nowPlaying')
    const nowPlayingText = document.getElementById('nowPlayingText')
    const showNowPlaying = Boolean(
        cfg && cfg.nowPlaying && cfg.nowPlaying.enabled && data.nowPlayingText)
    nowPlaying.hidden = !showNowPlaying
    nowPlayingText.textContent = showNowPlaying ? data.nowPlayingText : ''
    const ul = document.getElementById('playedSongsUl')
    ul.innerHTML = ''
    ;(data.playedTexts || []).forEach(text => {
        const li = document.createElement('li')
        const textElement = document.createElement('span')
        textElement.className = 'played-song-text'
        textElement.textContent = text
        li.appendChild(textElement)
        ul.appendChild(li)
    })
}

window.addEventListener('message', event => {
    if (!_isSettingsPreview ||
        !event.data ||
        event.data.type !== 'songlistspinner-settings-preview' ||
        !event.data.payload) return

    updateSongs(event.data.payload)
})

window.addEventListener('load', () => {
    SpinnerInterop.createWheel([{ label: 'Waiting for Dashboard...' }], [])
    SpinnerInterop.setupResizeObserver()
    if (_isSettingsPreview) {
        document.body.classList.add('settings-preview-mode')
    } else {
        connectSSE()
    }
})
</script>
</body>
</html>
